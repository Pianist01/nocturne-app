<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="author" content="Steven Peralta">
    <meta name="description" content="This is the Nocturne App, where you can stream shows made by other creators!">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="css/main.css">
    <link rel="apple-touch-icon" href="./icons/nocturne-apple-touch-180.png">
    <link rel="manifest" href="./manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Nocturne</title>
</head>
<body>

    <div class="splash-container">
            <img class="splash-logo" src="img/nocturneLogoVertical.png">
    </div>

    <main>
        <img class="current-show-image" src="img/ABEL_ Clash in the Rainstorm.png">

        <div class="home-container">
             <div class="title">
            <h1>ABEL</h1>
            <p class="show-caption">A Nocturne Original Series</p>
        </div>

        <button class="enter-show-btn">Learn More</button>

        <div class="menu-container">
            <div class="home">
                <img class="home-img" src="icons/home.svg">
                <p>Home</p>
            </div>
            <div class="divider"></div>
            <div class="profile">
                <img class="profile-img" src="icons/profile.svg">
                <p>Profile</p>
            </div>
        </div>
        </div>
    </main>
</body>
<script type="module" src="js/main.js"></script>
</html>
